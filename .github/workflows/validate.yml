name: Validate lab source
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse and test with Windows PowerShell 5.1
        shell: powershell
        run: ./tests/Test-Offline.ps1
      - name: Parse and test with PowerShell 7
        shell: pwsh
        run: ./tests/Test-Offline.ps1
