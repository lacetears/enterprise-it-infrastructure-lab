! Cisco 2960; connect Gi0/1 to R1 Gi0/0.
hostname SW1
no ip domain-lookup
ip domain-name lab.example.test
vlan 10
 name EMPLOYEES
vlan 20
 name IT
vlan 30
 name GUESTS
vlan 40
 name SERVERS
vlan 999
 name UNUSED_NATIVE
interface GigabitEthernet0/1
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,999
 no shutdown
interface range FastEthernet0/1 - 4
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
interface range FastEthernet0/5 - 6
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
interface range FastEthernet0/7 - 8
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
interface range FastEthernet0/9 - 10
 switchport mode access
 switchport access vlan 40
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
interface range FastEthernet0/11 - 24
 switchport mode access
 switchport access vlan 999
 shutdown
interface GigabitEthernet0/2
 switchport mode access
 switchport access vlan 999
 shutdown
interface vlan 20
 ip address 10.10.20.2 255.255.255.224
 no shutdown
ip default-gateway 10.10.20.1
ip access-list standard MANAGEMENT
 permit 10.10.20.0 0.0.0.31
 deny any
line vty 0 15
 access-class MANAGEMENT in
 login local
 transport input ssh
end
