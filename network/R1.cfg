! Cisco 2911 template; console paste after enable / configure terminal.
hostname R1
no ip domain-lookup
ip domain-name lab.example.test
! No SSH credential is committed. Complete console hardening in docs/network.md.
interface GigabitEthernet0/0
 no ip address
 no shutdown
interface GigabitEthernet0/0.10
 encapsulation dot1Q 10
 ip address 10.10.10.1 255.255.255.0
 ip helper-address 10.10.40.10
 ip access-group EMPLOYEE_IN in
interface GigabitEthernet0/0.20
 encapsulation dot1Q 20
 ip address 10.10.20.1 255.255.255.224
 ip helper-address 10.10.40.10
interface GigabitEthernet0/0.30
 encapsulation dot1Q 30
 ip address 10.10.30.1 255.255.255.0
 ip access-group GUEST_IN in
interface GigabitEthernet0/0.40
 encapsulation dot1Q 40
 ip address 10.10.40.1 255.255.255.224
interface GigabitEthernet0/0.999
 encapsulation dot1Q 999 native
 no ip address
interface GigabitEthernet0/1
 description SIMULATED-PUBLIC-SERVICES-NOT-INTERNET
 ip address 198.51.100.1 255.255.255.0
 no shutdown
ip dhcp excluded-address 10.10.30.1 10.10.30.99
ip dhcp excluded-address 10.10.30.200 10.10.30.254
ip dhcp pool GUESTS
 network 10.10.30.0 255.255.255.0
 default-router 10.10.30.1
 dns-server 198.51.100.10
ip access-list extended EMPLOYEE_IN
 permit udp any eq 68 any eq 67
 permit ip 10.10.10.0 0.0.0.255 10.10.40.0 0.0.0.31
 permit icmp 10.10.10.0 0.0.0.255 host 10.10.10.1 echo
 deny ip any any
ip access-list extended GUEST_IN
 permit udp any eq 68 any eq 67
 permit icmp 10.10.30.0 0.0.0.255 host 10.10.30.1 echo
 permit udp 10.10.30.0 0.0.0.255 host 198.51.100.10 eq 53
 permit tcp 10.10.30.0 0.0.0.255 host 198.51.100.10 eq 53
 permit tcp 10.10.30.0 0.0.0.255 host 198.51.100.10 eq 80
 permit tcp 10.10.30.0 0.0.0.255 host 198.51.100.10 eq 443
 deny ip any any
ip access-list standard MANAGEMENT
 permit 10.10.20.0 0.0.0.31
 deny any
line vty 0 4
 access-class MANAGEMENT in
 login local
 transport input ssh
end
